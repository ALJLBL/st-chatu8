                <button type="button" class="st-chatu8-icon-btn" id="edit_wavespeed_video_model_options" title="编辑/添加视频模型选项"><i class="fa-solid fa-pen-to-square"></i></button>

        </div>
        <div class="st-chatu8-field">
            <label for="wavespeed_image_param">参考图参数格式</label>
            <select id="wavespeed_image_param" class="st-chatu8-select" title="修图或图生视频上传参考图后写入请求体的字段格式">
                <option value="image">单图字段 (image: "https://...")</option>
                <option value="images">多图数组 (images: ["https://..."])</option>
                <option value="both">同时包含 (image + images，兼容性最强)</option>
            </select>
        </div>

    <!-- 生成参数 -->
    <div class="st-chatu8-settings-section">
        <h3>生成参数</h3>
        <div class="st-chatu8-field">
            <label for="wavespeed_size">预设尺寸</label>
            <select id="wavespeed_size" class="st-chatu8-select">
                <option value="1024x1024" selected>1024x1024 (1:1 标准正方形)</option>
                <option value="1280x720">1280x720 (16:9 横屏)</option>
                <option value="720x1280">720x1280 (9:16 竖屏)</option>
                <option value="1152x896">1152x896 (4:3 横屏)</option>
                <option value="896x1152">896x1152 (3:4 竖屏)</option>
                <option value="1536x1024">1536x1024 (3:2 高清横屏)</option>
                <option value="1024x1536">1024x1536 (2:3 高清竖屏)</option>
                <option value="1920x1080">1920x1080 (16:9 1080P横屏)</option>
                <option value="1080x1920">1080x1920 (9:16 1080P竖屏)</option>
                <option value="2048x2048">2048x2048 (1:1 2K正方形)</option>
                <option value="768x768">768x768 (1:1 轻量)</option>
                <option value="512x512">512x512 (1:1 极速)</option>
            </select>
        </div>
        <div class="st-chatu8-field">
            <label for="wavespeed_width">宽度 (width)</label>
            <input type="number" id="wavespeed_width" class="st-chatu8-text-input" value="1024" min="64" max="4096" step="16">
        </div>
        <div class="st-chatu8-field">
            <label for="wavespeed_height">高度 (height)</label>
            <input type="number" id="wavespeed_height" class="st-chatu8-text-input" value="1024" min="64" max="4096" step="16">
        </div>
        <div class="st-chatu8-field">
            <label for="wavespeed_size_format">尺寸分隔符格式 (size)</label>
            <select id="wavespeed_size_format" class="st-chatu8-select">
                <option value="asterisk">星号分隔 1024*1024（WaveSpeed v3 官方推荐）</option>
                <option value="x">字母分隔 1024x1024</option>
                <option value="width_height">拆分为独立 width / height 整数字段</option>
                <option value="none">不发送 size 字段（使用模型默认尺寸）</option>
            </select>
        </div>
        <div class="st-chatu8-field">
            <label for="wavespeed_seed">随机种子 (seed)</label>
            <input type="number" id="wavespeed_seed" class="st-chatu8-text-input" value="-1" placeholder="-1 为随机">
        </div>
        <div class="st-chatu8-field">
            <label for="wavespeed_steps">推理步数 (num_inference_steps，0 为默认)</label>
            <input type="number" id="wavespeed_steps" class="st-chatu8-text-input" value="0" min="0" max="150" placeholder="0 表示使用模型默认值">
        </div>
        <div class="st-chatu8-field">
            <label for="wavespeed_cfg">引导系数 (guidance_scale，0 为默认)</label>
            <input type="number" id="wavespeed_cfg" class="st-chatu8-text-input" value="0" min="0" max="30" step="0.5" placeholder="0 表示使用模型默认值">
        </div>
        <div class="st-chatu8-field">
            <label for="wavespeed_duration">视频生成时长 (duration 秒)</label>
            <input type="number" id="wavespeed_duration" class="st-chatu8-text-input" value="5" min="1" max="30" step="1">
        </div>
        <div class="st-chatu8-field">
            <label for="wavespeed_sync_mode">同步等待模式 (enable_sync_mode)</label>
            <div class="st-chatu8-toggle">
                <input id="wavespeed_sync_mode" type="checkbox" />
                <span class="st-chatu8-slider"></span>
            </div>
        </div>
        <div class="st-chatu8-field-col" style="margin-top: 8px;">
            <label for="wavespeed_extra_json">附加自定义 JSON 参数（可选，会合并进请求体）</label>
            <textarea id="wavespeed_extra_json" class="st-chatu8-textarea" rows="3" style="font-family: monospace; font-size: 12px;" placeholder='例如: {"output_format": "jpeg", "enable_safety_checker": false}'></textarea>
        </div>
    </div>
